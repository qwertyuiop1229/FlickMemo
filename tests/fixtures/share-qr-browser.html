<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share QR test</title>
<button id="btn-room-qr">QRコードを表示</button><button id="stop">共有を停止</button>
<script type="module">
import '/style.css';import {setupShareQr} from '/platform/shareQr.js';
let link='https://flickmemo-qwe.web.app/?room=rm_'+'a'.repeat(32)+'#key='+'b'.repeat(64);
const ui=setupShareQr({getUrl:()=>link});document.getElementById('stop').onclick=()=>{link=null;ui.reset()};window.stopSharing=()=>{link=null;ui.reset()};
</script></html>
