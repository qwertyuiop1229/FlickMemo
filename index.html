<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlickMemo - Studio</title>
    <link rel="icon" href="data:,">
    <!-- Google Fonts & Material Symbols -->
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto+Mono&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- 認証画面 (AI Studio風カード) -->
    <div id="auth-container" class="center-screen">
        <div class="studio-card auth-card">
            <div class="brand-icon">
                <span class="material-symbols-outlined">auto_awesome</span>
            </div>
            <h2>FlickMemo</h2>
            <p>超軽量・リアルタイム同期メモ帳</p>

            <div id="auth-loading" class="auth-loading hidden">
                <div class="spinner"></div>
                <span>ログイン処理中...</span>
            </div>

            <div id="auth-buttons" class="auth-buttons">
                <button id="btn-google" class="studio-btn btn-google">
                    <span class="material-symbols-outlined">login</span> Google でログイン
                </button>
                <button id="btn-ms" class="studio-btn btn-ms">
                    <span class="material-symbols-outlined">key</span> Microsoft でログイン
                </button>
            </div>
        </div>
    </div>

    <!-- アプリメイン画面 -->
    <div id="app-container" class="hidden">
        <!-- ヘッダー -->
        <header class="studio-header">
            <div class="header-left">
                <button id="btn-back" class="icon-btn mobile-only hidden" title="戻る">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <div class="brand">
                    <span class="material-symbols-outlined brand-spark">auto_awesome</span>
                    <span class="logo-text">FlickMemo</span>
                </div>
            </div>

            <div class="header-right">
                <span id="status-bar" class="status-badge">オフライン</span>
                <button id="btn-logout" class="icon-btn" title="ログアウト">
                    <span class="material-symbols-outlined">logout</span>
                </button>
            </div>
        </header>

        <!-- 2カラムレイアウト -->
        <div class="main-layout" id="main-layout">

            <!-- 左サイドバー（メモ一覧） -->
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-top">
                    <div class="search-bar">
                        <span class="material-symbols-outlined">search</span>
                        <input type="text" id="search-input" placeholder="メモを検索...">
                    </div>
                    <button id="btn-new" class="studio-btn-primary" title="新規メモ作成">
                        <span class="material-symbols-outlined">add</span> 新規作成
                    </button>
                </div>

                <div class="list-container">
                    <ul id="note-list" class="note-list"></ul>
                </div>
            </aside>

            <!-- 右エディタエリア -->
            <main class="editor-area" id="editor-area">
                <div class="editor-container">
                    <input type="text" id="note-title" class="title-input" placeholder="タイトルを入力..." disabled>
                    <div class="divider"></div>
                    <textarea id="note-body" class="body-input" placeholder="ここにテキストを入力..." disabled></textarea>
                </div>
            </main>

        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
