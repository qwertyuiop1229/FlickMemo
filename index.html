<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlickMemo</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto+Mono&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ログイン画面 (Material 3 Card) -->
    <div id="auth-container" class="center-screen">
        <div class="m3-card auth-card">
            <div class="brand-icon">
                <span class="material-symbols-outlined">edit_note</span>
            </div>
            <h2>FlickMemo</h2>
            <p>即座に書ける、超軽量メモ帳</p>

            <div id="auth-loading" class="auth-loading hidden">
                <div class="spinner"></div>
                <span>ログイン中...</span>
            </div>

            <div id="auth-buttons" class="auth-buttons">
                <button id="btn-google" class="m3-button btn-google">
                    <span class="material-symbols-outlined">login</span> Google でログイン
                </button>
                <button id="btn-ms" class="m3-button btn-ms">
                    <span class="material-symbols-outlined">key</span> Microsoft でログイン
                </button>
            </div>
        </div>
    </div>

    <!-- アプリメイン画面 -->
    <div id="app-container" class="hidden">
        <!-- ヘッダー (Top App Bar) -->
        <header class="m3-top-app-bar">
            <div class="header-left">
                <button id="btn-back" class="m3-icon-button mobile-only hidden" title="戻る">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <div class="brand-logo">
                    <span class="material-symbols-outlined brand-spark">auto_awesome</span>
                    <span class="logo-text">FlickMemo</span>
                </div>
            </div>

            <div class="header-right">
                <span id="status-bar" class="m3-badge">同期完了</span>
                <button id="btn-logout-trigger" class="m3-icon-button" title="ログアウト">
                    <span class="material-symbols-outlined">logout</span>
                </button>
            </div>
        </header>

        <!-- メインレイアウト -->
        <div class="main-layout" id="main-layout">
            <!-- ナビゲーションドロワー（サイドバー） -->
            <aside class="sidebar">
                <div class="sidebar-top">
                    <div class="m3-search-bar">
                        <span class="material-symbols-outlined">search</span>
                        <input type="text" id="search-input" placeholder="メモを検索...">
                    </div>
                    <button id="btn-new" class="m3-fab-button">
                        <span class="material-symbols-outlined">add</span> 新しいメモ
                    </button>
                </div>

                <div class="list-container">
                    <ul id="note-list" class="note-list"></ul>
                    <div id="empty-state" class="empty-state hidden">メモがありません</div>
                </div>
            </aside>

            <!-- エディタエリア -->
            <main class="editor-area">
                <!-- マテリアルツールバー (Undo / Redo / Pin / Copy) -->
                <div class="editor-toolbar hidden" id="editor-toolbar">
                    <div class="toolbar-group">
                        <button id="btn-undo" class="m3-icon-button" title="元に戻す (Undo)" disabled>
                            <span class="material-symbols-outlined">undo</span>
                        </button>
                        <button id="btn-redo" class="m3-icon-button" title="やり直す (Redo)" disabled>
                            <span class="material-symbols-outlined">redo</span>
                        </button>
                    </div>

                    <div class="toolbar-group">
                        <button id="btn-pin" class="m3-icon-button" title="ピン留め">
                            <span class="material-symbols-outlined">push_pin</span>
                        </button>
                        <button id="btn-copy" class="m3-icon-button" title="コピー">
                            <span class="material-symbols-outlined">content_copy</span>
                        </button>
                        <span class="char-count" id="char-count">0 文字</span>
                    </div>
                </div>

                <textarea id="note-body" class="m3-text-area" placeholder="メモを入力..." disabled></textarea>
            </main>
        </div>
    </div>

    <!-- ログアウト確認ダイアログ (Material 3 Dialog) -->
    <div id="logout-modal" class="modal-overlay hidden">
        <div class="m3-dialog">
            <div class="dialog-icon">
                <span class="material-symbols-outlined">logout</span>
            </div>
            <h3>ログアウトの確認</h3>
            <p>本当にログアウトしますか？</p>
            <div class="dialog-actions">
                <button id="btn-modal-cancel" class="m3-text-button">キャンセル</button>
                <button id="btn-modal-confirm" class="m3-text-button btn-danger">ログアウト</button>
            </div>
        </div>
    </div>

    <!-- 「1個戻る（Undo）」トースト通知 (Material 3 Snackbar) -->
    <div id="toast-undo" class="m3-snackbar hidden">
        <span>メモを削除しました</span>
        <button id="btn-toast-undo" class="snackbar-action">元に戻す</button>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
