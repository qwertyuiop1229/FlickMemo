<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlickMemo</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto+Mono&display=swap">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ログイン画面 -->
    <div id="auth-container" class="center-screen">
        <div class="studio-card">
            <div class="brand-icon">
                <span class="material-symbols-outlined">edit_note</span>
            </div>
            <h2>FlickMemo</h2>
            <p>即座に書ける、超軽量メモ帳</p>

            <div id="auth-loading" class="auth-loading hidden">
                <div class="spinner"></div>
                <span>ログイン中...</span>
            </div>

            <div id="auth-buttons" class="auth-buttons">
                <button id="btn-google" class="studio-btn btn-google">
                    <span class="material-symbols-outlined">login</span> Google でログイン
                </button>
                <button id="btn-ms" class="studio-btn btn-ms">
                    <span class="material-symbols-outlined">key</span> Microsoft でログイン
                </button>
            </div>
        </div>
    </div>

    <!-- メイン画面 -->
    <div id="app-container" class="hidden">
        <header class="studio-header">
            <div class="header-left">
                <button id="btn-back" class="icon-btn mobile-only hidden" title="戻る">
                    <span class="material-symbols-outlined">arrow_back</span>
                </button>
                <span class="logo-text">FlickMemo</span>
            </div>

            <div class="header-right">
                <span id="status-bar" class="status-badge">同期完了</span>
                <button id="btn-logout" class="icon-btn" title="ログアウト">
                    <span class="material-symbols-outlined">logout</span>
                </button>
            </div>
        </header>

        <div class="main-layout" id="main-layout">
            <!-- サイドバー -->
            <aside class="sidebar">
                <div class="sidebar-top">
                    <div class="search-bar">
                        <span class="material-symbols-outlined">search</span>
                        <input type="text" id="search-input" placeholder="検索...">
                    </div>
                    <button id="btn-new" class="studio-btn-primary">
                        <span class="material-symbols-outlined">add</span> 新しいメモ
                    </button>
                </div>

                <div class="list-container">
                    <ul id="note-list" class="note-list"></ul>
                    <div id="empty-state" class="empty-state hidden">メモがありません</div>
                </div>
            </aside>

            <!-- エディタエリア（テキストエリア1つだけの極限シンプル） -->
            <main class="editor-area">
                <textarea id="note-body" class="body-input" placeholder="メモを入力..." disabled></textarea>
            </main>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
