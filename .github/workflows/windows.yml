name: Windows desktop checks
on:
  push:
    branches: [codex/windows-desktop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
            windows-rust-
      - name: Verify Web and extension regression suite
        run: npm run check
      - name: Build shared desktop frontend
        run: npm run build:desktop
      - name: Verify native formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Native tests (synthetic history only, no OS clipboard writes)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run package:windows -- --ci
      - uses: actions/upload-artifact@v4
        with:
          name: FlickMemo-Windows-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/flickmemo-desktop.exe
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
