name: Windows desktop checks
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: >-
      github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'release: Web and Windows v')
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked frontend dependencies
        run: npm ci
      - uses: actions/cache/restore@v4
        id: rust-cache
        with:
          path: src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-
            windows-rust-
      - name: Verify Web and extension regression suite
        run: npm run check
      - name: Build shared desktop frontend
        run: npm run build:desktop
      - name: Verify release versions
        run: npm run verify:versions
      - name: Verify native formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Database rules and history deletion in isolated emulators
        run: |
          npm install --global firebase-tools@15.9.1
          firebase emulators:exec --project demo-flickmemo --only "auth,database" --config firebase.emulator.json "node scripts/verify-database-emulator.mjs"
      - name: Native tests (synthetic history only, no OS clipboard writes)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build Windows installer
        run: npm run package:windows -- --ci
      - name: Isolated WebView lifecycle and private memory sample
        run: ./scripts/measure-windows.ps1 -Executable ./src-tauri/target/release/flickmemo-desktop.exe
      - name: Publish verified versioned Windows files
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish-windows.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: FlickMemo-Windows-unsigned
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/flickmemo-desktop.exe
            desktop-reports/memory.csv
            desktop-reports/lifecycle.json
            desktop-reports/clipboard.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/cache/save@v4
        if: always() && steps.rust-cache.outputs.cache-hit != 'true'
        with:
          path: src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}-${{ github.sha }}
