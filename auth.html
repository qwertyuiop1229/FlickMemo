<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>FlickMemo - ログイン認証</title>
    <style>
        body {
            background: #131314;
            color: #e3e2e6;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #333537;
            border-top-color: #a8c7fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="spinner"></div>
    <p id="msg">Google ログイン処理中...</p>
    <script type="module" src="auth.js"></script>
</body>

</html>
