<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlickMemo - Google ログイン</title>
    <style>
        body {
            background: #131314;
            color: #e3e2e6;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333537;
            border-top-color: #a8c7fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.2rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        p {
            font-size: 0.95rem;
            color: #c4c6d0;
        }
    </style>
</head>

<body>
    <div class="spinner"></div>
    <p id="msg">Google 認証を実行しています...</p>
    <script type="module" src="auth.js"></script>
</body>

</html>
