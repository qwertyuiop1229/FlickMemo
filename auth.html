<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlickMemo - Google ログイン</title>
    <link rel="icon" href="/icons/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
    <style>
        body {
            background: #131314;
            color: #e3e2e6;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333537;
            border-top-color: #a8c7fa;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 1.2rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        p {
            font-size: 0.95rem;
            color: #c4c6d0;
        }
    </style>
</head>

<body>
    <div id="spinner" class="spinner"></div>
    <p id="msg">Google 認証を実行しています...</p>
    <button id="btn-login-manual" style="display:none; background:#1a73e8; color:#fff; border:none; padding:0.75rem 1.6rem; border-radius:9999px; font-size:0.95rem; font-weight:500; cursor:pointer; align-items:center; gap:0.5rem; transition:background 0.2s;">
        Google でログインを続行
    </button>
    <script type="module" src="auth.js"></script>
</body>

</html>
